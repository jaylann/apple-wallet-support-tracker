name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver version to release (e.g. 1.0.0). The "v" prefix is added automatically.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Tag and Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify RELEASE_TOKEN is configured
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::RELEASE_TOKEN secret is not set. Generate a fine-grained PAT scoped to this repo with 'Contents: write' and 'Workflows: write', then add it as the RELEASE_TOKEN repo secret. The default GITHUB_TOKEN cannot bypass the 'Lock main to release workflow' ruleset on personal repos because the GitHub Actions integration cannot be added as a bypass actor."
            exit 1
          fi

      - name: Checkout stage
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: stage
          fetch-depth: 0
          # Use the PAT so subsequent `git push` commands (stage->main, tag) inherit
          # admin-bypass on the main-branch ruleset. Default GITHUB_TOKEN cannot bypass.
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: true

      - name: Validate version is semver
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not valid semver (X.Y.Z[-pre][+build])"
            exit 1
          fi
          echo "Version $VERSION is valid semver."

      - name: Verify tag does not already exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git fetch --tags
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists. Pick a new version."
            exit 1
          fi
          echo "Tag v$VERSION is available."

      - name: Verify CHANGELOG [Unreleased] has content
        run: |
          # New work always accumulates under "## [Unreleased]". The release
          # itself renames that heading to the dispatched version (see the "Cut
          # CHANGELOG" step below), so here we only require the section to exist
          # and be non-empty — never that the version already appears.
          if ! grep -qE '^## \[Unreleased\]' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [Unreleased]' section. Accumulate changes there; the release renames it to the version you dispatch."
            exit 1
          fi
          section="$(awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)"
          if ! printf '%s' "$section" | grep -qE '[^[:space:]]'; then
            echo "::error::CHANGELOG '## [Unreleased]' section is empty — nothing to release. Land changes under [Unreleased] first."
            exit 1
          fi
          echo "[Unreleased] section has content; it will be cut into this release."

      - name: Verify latest stage CI run is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh run list --workflow=test.yml --branch=stage --limit=1 --json status,conclusion,headSha -q '.[0]')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "::error::No test.yml runs found for stage. Push to stage first."
            exit 1
          fi
          STATUS=$(echo "$LATEST" | jq -r '.status')
          CONCLUSION=$(echo "$LATEST" | jq -r '.conclusion')
          HEAD_SHA=$(echo "$LATEST" | jq -r '.headSha')
          STAGE_SHA=$(git rev-parse origin/stage)
          echo "Latest run: status=$STATUS conclusion=$CONCLUSION sha=$HEAD_SHA (stage HEAD=$STAGE_SHA)"
          if [ "$STATUS" != "completed" ] || [ "$CONCLUSION" != "success" ]; then
            echo "::error::Latest test.yml run on stage is not a successful completion. Fix CI before releasing."
            exit 1
          fi
          if [ "$HEAD_SHA" != "$STAGE_SHA" ]; then
            echo "::warning::Latest CI run was for $HEAD_SHA but stage HEAD is $STAGE_SHA. Push a fresh build to stage and wait for CI before releasing."
            exit 1
          fi

      - name: Run strict validation
        run: |
          npm ci
          npm run validate:strict || {
            echo "::warning::Strict validation failed (likely empty sources[]). Continuing — strict mode is advisory at v1.0.0."
          }

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cut CHANGELOG (Unreleased -> version) and commit to stage
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          # Rename "## [Unreleased]" to "## [X.Y.Z] — <date>" and open a fresh,
          # empty "## [Unreleased]" above it so subsequent work keeps landing
          # there. This is the Keep-a-Changelog "cut" step and the single place
          # the version string is written into the CHANGELOG.
          awk -v ver="$VERSION" -v date="$DATE" '
            !cut && /^## \[Unreleased\]/ {
              print "## [Unreleased]"
              print ""
              print "## [" ver "] — " date
              cut = 1
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "chore(release): cut CHANGELOG for v$VERSION"
          # Land the cut on stage first; the fast-forward below carries it to main.
          git push origin stage

      - name: Fast-forward main to stage
        run: |
          # Server rejects if not fast-forward, which enforces stage-only releases.
          git push origin stage:main

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --target main \
            --generate-notes
