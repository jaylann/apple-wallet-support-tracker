name: Monthly Sweep

on:
  schedule:
    # 04:00 UTC on the 1st of every month.
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      agent:
        description: "Which research agent to use"
        type: choice
        default: claude
        options: [claude, codex]
      brands_filter:
        description: "Optional CSV of slugs to scope the sweep (e.g. lufthansa,delta-air-lines). Empty = all brands."
        type: string
        default: ""
      dry_run:
        description: "Run the agent end-to-end but skip opening a PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # required by claude-code-action for OIDC

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: stage
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Resolve agent
        id: agent
        env:
          INPUT: ${{ inputs.agent }}
        run: |
          name="${INPUT:-claude}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Agent: $name"

      - name: Compute sweep month
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Resolve monthly milestone (find or create)
        id: milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONTH: ${{ steps.month.outputs.month }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="$MONTH"
          num=$(gh api "repos/$REPO/milestones?state=open&per_page=100" --jq "[.[] | select(.title == \"$title\")] | .[0].number // empty")
          if [ -z "$num" ]; then
            num=$(gh api -X POST "repos/$REPO/milestones" -f title="$title" -f description="Monthly release cadence — agent activity (sweep + issue handler) for $MONTH." --jq '.number')
            echo "Created milestone '$title' (#$num)"
          else
            echo "Reusing milestone '$title' (#$num)"
          fi
          echo "number=$num" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Write sweep config for agent
        env:
          BRANDS_FILTER: ${{ inputs.brands_filter }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          mkdir -p .agent
          # Convert CSV input to JSON array. Empty string = all brands.
          if [ -z "${BRANDS_FILTER:-}" ]; then
            brands_json="[]"
          else
            brands_json=$(echo "$BRANDS_FILTER" | tr ',' '\n' | grep -v '^$' | jq -R . | jq -s .)
          fi
          jq -n \
            --argjson brands "$brands_json" \
            --arg dry_run "${DRY_RUN:-false}" \
            '{ brands: $brands, dryRun: ($dry_run == "true") }' \
            > .agent/sweep-config.json
          cat .agent/sweep-config.json

      - name: Validate Claude subscription token
        if: steps.agent.outputs.name == 'claude'
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not set. Generate via 'claude setup-token' and add as a repo secret."
            exit 1
          fi

      - name: Validate Codex subscription auth
        if: steps.agent.outputs.name == 'codex'
        env:
          AUTH: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "${AUTH:-}" ]; then
            echo "::error::CODEX_AUTH_JSON secret is not set. Run 'codex login' locally, paste contents of ~/.codex/auth.json into the secret."
            exit 1
          fi

      - name: Load Claude sweep prompt
        if: steps.agent.outputs.name == 'claude'
        run: |
          {
            echo 'CLAUDE_PROMPT<<PROMPT_EOF'
            cat prompts/sweep.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_ENV"

      - name: Run Claude sweep
        if: steps.agent.outputs.name == 'claude'
        id: claude_sweep
        uses: anthropics/claude-code-action@fefa07e9c665b7320f08c3b525980457f22f58aa # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ env.CLAUDE_PROMPT }}
          # Task tool enables parallel subagents. Higher max-turns budget
          # because the orchestrator + ~6 subagents collectively need more
          # turns than a sequential single-agent run.
          # --effort medium: balanced speed/cost/quality per Anthropic's
          # recommended default for agentic, tool-heavy workflows.
          claude_args: "--max-turns 120 --effort medium --allowedTools WebSearch,WebFetch,Read,Edit,Bash,Task"
        continue-on-error: true

      - name: Run Codex sweep
        if: steps.agent.outputs.name == 'codex'
        id: codex_sweep
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          set -euo pipefail
          mkdir -p ~/.codex
          printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json
          npm install -g @openai/codex
          # --model gpt-5.5: latest frontier model
          # -c model_reasoning_effort=medium: balanced for tool-heavy work
          codex exec \
            --full-auto \
            --skip-git-repo-check \
            --model gpt-5.5 \
            -c model_reasoning_effort=medium \
            "$(cat prompts/sweep.md)"
        continue-on-error: true

      - name: Resolve agent step outcome
        id: agent_outcome
        run: |
          if [ "${{ steps.agent.outputs.name }}" = "claude" ]; then
            echo "outcome=${{ steps.claude_sweep.outcome }}" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=${{ steps.codex_sweep.outcome }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate after sweep
        id: validate
        if: steps.agent_outcome.outputs.outcome == 'success'
        run: npm run validate
        continue-on-error: true

      - name: Publish run summary
        if: always()
        run: |
          {
            echo "# Sweep ${{ steps.month.outputs.month }}"
            echo ""
            echo "- **Agent:** \`${{ steps.agent.outputs.name }}\`"
            echo "- **Brands filter:** \`${{ inputs.brands_filter || 'all' }}\`"
            echo "- **Dry-run:** \`${{ inputs.dry_run || 'false' }}\`"
            echo "- **Sweep outcome:** \`${{ steps.agent_outcome.outputs.outcome }}\`"
            echo "- **Validate outcome:** \`${{ steps.validate.outcome }}\`"
            echo ""
            if [ -f .agent/sweep-summary.md ]; then
              echo "## Agent summary"
              echo ""
              cat .agent/sweep-summary.md
            else
              echo "_Agent did not write \`.agent/sweep-summary.md\`._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure sweep summary file exists
        if: always()
        run: |
          # create-pull-request reads body-path, and hard-fails if the file is
          # missing. A sweep that forgot to write the summary would therefore
          # fail the PR step and vanish silently. Guarantee the file so the PR
          # (and the failure issue) can always be created.
          if [ ! -f .agent/sweep-summary.md ]; then
            mkdir -p .agent
            {
              echo "## Sweep summary"
              echo ""
              echo "_The sweep agent did not write \`.agent/sweep-summary.md\`. Fallback body — inspect the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for what actually changed._"
            } > .agent/sweep-summary.md
            echo "::warning::sweep-summary.md was missing; wrote a fallback body."
          fi

      - name: Open PR with sweep results
        id: open_pr
        if: |
          steps.agent_outcome.outputs.outcome == 'success' &&
          steps.validate.outcome == 'success' &&
          !inputs.dry_run
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          base: stage
          branch: agent/sweep-${{ steps.month.outputs.month }}-${{ steps.agent.outputs.name }}
          delete-branch: true
          commit-message: "data: monthly sweep ${{ steps.month.outputs.month }} (${{ steps.agent.outputs.name }})"
          title: "Monthly sweep ${{ steps.month.outputs.month }} (${{ steps.agent.outputs.name }})"
          body-path: .agent/sweep-summary.md
          milestone: ${{ steps.milestone.outputs.number }}
          labels: |
            type:chore
            area:data
            agent-handled

      - name: Open issue on sweep failure
        # Also fires when the PR step itself fails (e.g. create-pull-request
        # errors) — previously only agent/validate failures notified, so a
        # broken PR step failed silently with no issue and no PR.
        if: >-
          always() &&
          (steps.agent_outcome.outputs.outcome == 'failure' ||
          steps.validate.outcome == 'failure' ||
          steps.open_pr.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MILESTONE_TITLE: ${{ steps.milestone.outputs.title }}
        run: |
          gh issue create \
            --title "Monthly sweep ${{ steps.month.outputs.month }} failed (${{ steps.agent.outputs.name }})" \
            --label "type:bug,area:ci,priority:high" \
            --milestone "$MILESTONE_TITLE" \
            --body "Sweep workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Agent: ${{ steps.agent.outputs.name }}
            Sweep step outcome: ${{ steps.agent_outcome.outputs.outcome }}
            Validate step outcome: ${{ steps.validate.outcome }}
            PR step outcome: ${{ steps.open_pr.outcome }}

            Investigate and either re-run the workflow manually or land a fix."
