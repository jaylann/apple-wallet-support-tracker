name: Monthly Sweep

on:
  schedule:
    # 04:00 UTC on the 1st of every month.
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Compute sweep month
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code sweep
        id: sweep
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt_file: prompts/sweep.md
          claude_args: "--max-turns 60 --allowedTools WebSearch,WebFetch,Read,Edit,Bash"
        continue-on-error: true

      - name: Validate after sweep
        id: validate
        if: steps.sweep.outcome == 'success'
        run: npm run validate
        continue-on-error: true

      - name: Open PR with sweep results
        if: steps.sweep.outcome == 'success' && steps.validate.outcome == 'success'
        uses: peter-evans/create-pull-request@v6
        with:
          base: stage
          branch: agent/sweep-${{ steps.month.outputs.month }}
          delete-branch: true
          commit-message: "data: monthly sweep ${{ steps.month.outputs.month }}"
          title: "Monthly sweep ${{ steps.month.outputs.month }}"
          body: |
            Automated monthly sweep generated by `.github/workflows/sweep.yml`.

            The agent verified each row against current sources, bumped `lastChecked`, and refreshed citations. See the diff for per-row before/after.

            ## Reviewer checklist

            - [ ] Spot-check 3 random rows against their cited URLs
            - [ ] Confirm no `sources[].url` is fabricated
            - [ ] Confirm CHANGELOG `[Unreleased]` reflects notable changes (edit on this PR or in a follow-up)
            - [ ] All `type:*` and `area:*` labels present
          labels: |
            type:chore
            area:data
            agent-handled

      - name: Open issue on sweep failure
        if: steps.sweep.outcome == 'failure' || steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Monthly sweep ${{ steps.month.outputs.month }} failed" \
            --label "type:bug,area:ci,priority:high" \
            --body "Sweep workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Sweep step outcome: ${{ steps.sweep.outcome }}
            Validate step outcome: ${{ steps.validate.outcome }}

            Investigate and either re-run the workflow manually or land a fix."
