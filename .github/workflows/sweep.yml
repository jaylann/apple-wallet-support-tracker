name: Monthly Sweep

on:
  schedule:
    # 04:00 UTC on the 1st of every month.
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      agent:
        description: "Which research agent to use"
        type: choice
        default: claude
        options: [claude, codex]
      brands_filter:
        description: "Optional CSV of slugs to scope the sweep (e.g. lufthansa,delta-air-lines). Empty = all brands."
        type: string
        default: ""
      dry_run:
        description: "Run the agent end-to-end but skip opening a PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: stage
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Resolve agent
        id: agent
        env:
          INPUT: ${{ inputs.agent }}
        run: |
          name="${INPUT:-claude}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Agent: $name"

      - name: Compute sweep month
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Write sweep config for agent
        env:
          BRANDS_FILTER: ${{ inputs.brands_filter }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          mkdir -p .agent
          # Convert CSV input to JSON array. Empty string = all brands.
          if [ -z "${BRANDS_FILTER:-}" ]; then
            brands_json="[]"
          else
            brands_json=$(echo "$BRANDS_FILTER" | tr ',' '\n' | grep -v '^$' | jq -R . | jq -s .)
          fi
          jq -n \
            --argjson brands "$brands_json" \
            --arg dry_run "${DRY_RUN:-false}" \
            '{ brands: $brands, dryRun: ($dry_run == "true") }' \
            > .agent/sweep-config.json
          cat .agent/sweep-config.json

      - name: Validate Claude subscription token
        if: steps.agent.outputs.name == 'claude'
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not set. Generate via 'claude setup-token' and add as a repo secret."
            exit 1
          fi

      - name: Validate Codex subscription auth
        if: steps.agent.outputs.name == 'codex'
        env:
          AUTH: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "${AUTH:-}" ]; then
            echo "::error::CODEX_AUTH_JSON secret is not set. Run 'codex login' locally, paste contents of ~/.codex/auth.json into the secret."
            exit 1
          fi

      - name: Run Claude sweep
        if: steps.agent.outputs.name == 'claude'
        id: claude_sweep
        uses: anthropics/claude-code-action@fefa07e9c665b7320f08c3b525980457f22f58aa # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt_file: prompts/sweep.md
          # Task tool enables parallel subagents. Higher max-turns budget
          # because the orchestrator + ~6 subagents collectively need more
          # turns than a sequential single-agent run.
          claude_args: "--max-turns 120 --allowedTools WebSearch,WebFetch,Read,Edit,Bash,Task"
        continue-on-error: true

      - name: Run Codex sweep
        if: steps.agent.outputs.name == 'codex'
        id: codex_sweep
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          set -euo pipefail
          mkdir -p ~/.codex
          printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json
          npm install -g @openai/codex
          codex exec --full-auto --skip-git-repo-check "$(cat prompts/sweep.md)"
        continue-on-error: true

      - name: Resolve agent step outcome
        id: agent_outcome
        run: |
          if [ "${{ steps.agent.outputs.name }}" = "claude" ]; then
            echo "outcome=${{ steps.claude_sweep.outcome }}" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=${{ steps.codex_sweep.outcome }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate after sweep
        id: validate
        if: steps.agent_outcome.outputs.outcome == 'success'
        run: npm run validate
        continue-on-error: true

      - name: Publish run summary
        if: always()
        run: |
          {
            echo "# Sweep ${{ steps.month.outputs.month }}"
            echo ""
            echo "- **Agent:** \`${{ steps.agent.outputs.name }}\`"
            echo "- **Brands filter:** \`${{ inputs.brands_filter || 'all' }}\`"
            echo "- **Dry-run:** \`${{ inputs.dry_run || 'false' }}\`"
            echo "- **Sweep outcome:** \`${{ steps.agent_outcome.outputs.outcome }}\`"
            echo "- **Validate outcome:** \`${{ steps.validate.outcome }}\`"
            echo ""
            if [ -f .agent/sweep-summary.md ]; then
              echo "## Agent summary"
              echo ""
              cat .agent/sweep-summary.md
            else
              echo "_Agent did not write \`.agent/sweep-summary.md\`._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open PR with sweep results
        if: |
          steps.agent_outcome.outputs.outcome == 'success' &&
          steps.validate.outcome == 'success' &&
          inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          base: stage
          branch: agent/sweep-${{ steps.month.outputs.month }}-${{ steps.agent.outputs.name }}
          delete-branch: true
          commit-message: "data: monthly sweep ${{ steps.month.outputs.month }} (${{ steps.agent.outputs.name }})"
          title: "Monthly sweep ${{ steps.month.outputs.month }} (${{ steps.agent.outputs.name }})"
          body-path: .agent/sweep-summary.md
          labels: |
            type:chore
            area:data
            agent-handled

      - name: Open issue on sweep failure
        if: steps.agent_outcome.outputs.outcome == 'failure' || steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Monthly sweep ${{ steps.month.outputs.month }} failed (${{ steps.agent.outputs.name }})" \
            --label "type:bug,area:ci,priority:high" \
            --body "Sweep workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Agent: ${{ steps.agent.outputs.name }}
            Sweep step outcome: ${{ steps.agent_outcome.outputs.outcome }}
            Validate step outcome: ${{ steps.validate.outcome }}

            Investigate and either re-run the workflow manually or land a fix."
