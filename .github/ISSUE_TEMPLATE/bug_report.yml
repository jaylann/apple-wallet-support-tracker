name: Bug report
description: Report a bug in the workflows, validation script, or schema
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        For wrong **data**, use the [Data correction template](?template=correction.yml) instead.

        For security issues, **do not** file a public issue — see [SECURITY.md](https://github.com/jaylann/apple-wallet-support-tracker/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's broken and what should happen instead?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "schema — JSON Schema or shape definitions"
        - "scripts — validate.ts, pre-public-check.sh"
        - "ci — workflows / labeler / dependabot"
        - "prompts — sweep.md / issue-fix.md"
        - "docs — README, methodology, ADRs"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      render: shell
